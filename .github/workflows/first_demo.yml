name: CI
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "lint step running"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "test step running"

  test:
    runs-on: ubuntu-latest
    steps:
      -uses: actions/checkout@v4
      -run: echo "running test"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      -run: echo "deploying (only if test passes)"
